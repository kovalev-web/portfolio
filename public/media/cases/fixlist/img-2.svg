<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1236" viewBox="0 0 1440 1236" role="img">
  <title>Pipeline: evidence gathered first, judged second</title>
  <desc>A URL flows into an Evidence stage — a real Chromium capture of up to 20 screenshots plus PageSpeed metrics — then into a Judgment stage scoring 32 criteria in 8 groups. One rubric cell and one screenshot share the same accent-colored marker, showing a finding pinned to its evidence. Judgment then produces two different outputs: a report page for a person, and an agent-ready.md file for a coding agent.</desc>

  <!--
    Colors are hardcoded, no CSS custom properties: var() resolution inside
    an SVG rendered as an image tag is unreliable across browsers, and a
    broken var() here silently paints nothing. Palette matches the site's
    light theme tokens but is fixed, not theme aware. This file has no way
    to see the site's own light/dark toggle, only the OS color scheme, and
    the two can disagree. Same treatment as the raster screenshots elsewhere
    in this case: one look, regardless of page theme.
  -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="1236" fill="#f2f1ee"/>

  <!-- URL input -->
  <rect x="520" y="50" width="400" height="64" rx="32" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="720" y="83" font-size="19" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0a0a0b" text-anchor="middle" dominant-baseline="central">https://yoursite.com</text>
  <line x1="720" y1="114" x2="720" y2="160" stroke="#d9d7d0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Evidence panel -->
  <rect x="60" y="170" width="1320" height="360" rx="20" fill="none" stroke="#d9d7d0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="204" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" letter-spacing="1" fill="#78766f">EVIDENCE, GATHERED FIRST</text>

  <!-- Playwright capture -->
  <text x="100" y="248" font-size="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" fill="#0a0a0b">Real Chromium, 1440×900</text>
  <text x="100" y="274" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">Scrolls the page and captures up to 20 screens</text>

  <rect x="100" y="290" width="120" height="78" rx="8" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="112" y="308" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">1</text>
  <rect x="146" y="306" width="120" height="78" rx="8" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="158" y="324" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">2</text>
  <rect x="192" y="322" width="120" height="78" rx="8" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="204" y="340" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">3</text>
  <rect x="238" y="338" width="120" height="78" rx="8" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="250" y="356" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">4</text>
  <rect x="284" y="354" width="120" height="78" rx="8" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="296" y="372" font-size="12" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">5</text>
  <rect x="330" y="370" width="120" height="78" rx="8" fill="#f9f8f6" stroke="#5b53f5" stroke-width="2"/>
  <text x="342" y="390" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700" fill="#5b53f5">6</text>

  <rect x="100" y="464" width="170" height="32" rx="16" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="185" y="481" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f" text-anchor="middle" dominant-baseline="central">+ DOM digest</text>

  <!-- PageSpeed -->
  <text x="820" y="248" font-size="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" fill="#0a0a0b">PageSpeed Insights</text>
  <text x="820" y="274" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">Field metrics from the real page</text>

  <rect x="820" y="300" width="260" height="48" rx="10" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="950" y="324" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0a0a0b" text-anchor="middle" dominant-baseline="central">LCP · 2.4s</text>
  <rect x="820" y="360" width="260" height="48" rx="10" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="950" y="384" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0a0a0b" text-anchor="middle" dominant-baseline="central">CLS · 0.08</text>
  <rect x="820" y="420" width="260" height="48" rx="10" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <text x="950" y="444" font-size="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#0a0a0b" text-anchor="middle" dominant-baseline="central">TBT · 180ms</text>

  <line x1="720" y1="530" x2="720" y2="576" stroke="#d9d7d0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Judgment panel -->
  <rect x="60" y="576" width="1320" height="330" rx="20" fill="none" stroke="#d9d7d0" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="90" y="610" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" letter-spacing="1" fill="#78766f">JUDGMENT, AGAINST A FIXED RUBRIC</text>
  <text x="720" y="650" font-size="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" fill="#0a0a0b" text-anchor="middle">32 criteria, 8 groups</text>
  <text x="720" y="676" font-size="15" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f" text-anchor="middle">Each one scored independently, from what's visible on screen</text>

  <!-- 8x4 rubric grid, cell 36 + gap 8, centered -->
  <g fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1">
    <rect x="548" y="700" width="36" height="36" rx="6"/>
    <rect x="592" y="700" width="36" height="36" rx="6"/>
    <rect x="636" y="700" width="36" height="36" rx="6"/>
    <rect x="680" y="700" width="36" height="36" rx="6"/>
    <rect x="724" y="700" width="36" height="36" rx="6"/>
    <rect x="768" y="700" width="36" height="36" rx="6"/>
    <rect x="812" y="700" width="36" height="36" rx="6"/>
    <rect x="856" y="700" width="36" height="36" rx="6"/>

    <rect x="548" y="744" width="36" height="36" rx="6"/>
    <rect x="592" y="744" width="36" height="36" rx="6"/>
    <rect x="636" y="744" width="36" height="36" rx="6"/>
    <rect x="680" y="744" width="36" height="36" rx="6"/>
    <rect x="724" y="744" width="36" height="36" rx="6"/>
    <rect x="768" y="744" width="36" height="36" rx="6" stroke="#5b53f5" stroke-width="2"/>
    <rect x="812" y="744" width="36" height="36" rx="6"/>
    <rect x="856" y="744" width="36" height="36" rx="6"/>

    <rect x="548" y="788" width="36" height="36" rx="6"/>
    <rect x="592" y="788" width="36" height="36" rx="6"/>
    <rect x="636" y="788" width="36" height="36" rx="6"/>
    <rect x="680" y="788" width="36" height="36" rx="6"/>
    <rect x="724" y="788" width="36" height="36" rx="6"/>
    <rect x="768" y="788" width="36" height="36" rx="6"/>
    <rect x="812" y="788" width="36" height="36" rx="6"/>
    <rect x="856" y="788" width="36" height="36" rx="6"/>

    <rect x="548" y="832" width="36" height="36" rx="6"/>
    <rect x="592" y="832" width="36" height="36" rx="6"/>
    <rect x="636" y="832" width="36" height="36" rx="6"/>
    <rect x="680" y="832" width="36" height="36" rx="6"/>
    <rect x="724" y="832" width="36" height="36" rx="6"/>
    <rect x="768" y="832" width="36" height="36" rx="6"/>
    <rect x="812" y="832" width="36" height="36" rx="6"/>
    <rect x="856" y="832" width="36" height="36" rx="6"/>
  </g>
  <text x="786" y="763" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700" fill="#5b53f5" text-anchor="middle" dominant-baseline="central">6</text>

  <!-- The one finding, pinned back to its screenshot: same accent, same number -->
  <path d="M786,744 C 650,650 550,480 452,372" fill="none" stroke="#5b53f5" stroke-width="1.5" stroke-dasharray="3 5" marker-end="url(#arrow)"/>

  <line x1="720" y1="906" x2="720" y2="950" stroke="#d9d7d0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720,906 L720,950 L380,950 L380,994" fill="none" stroke="#d9d7d0" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M720,906 L720,950 L1060,950 L1060,994" fill="none" stroke="#d9d7d0" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output: report page (for a person) -->
  <rect x="140" y="996" width="560" height="200" rx="16" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <line x1="140" y1="1028" x2="700" y2="1028" stroke="#d9d7d0" stroke-width="1.5"/>
  <circle cx="164" cy="1012" r="4" fill="#d9d7d0"/>
  <circle cx="182" cy="1012" r="4" fill="#d9d7d0"/>
  <circle cx="200" cy="1012" r="4" fill="#d9d7d0"/>
  <text x="164" y="1058" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" fill="#0a0a0b">Report page</text>
  <text x="164" y="1082" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">For a person — score, verdict, priorities</text>
  <rect x="580" y="1044" width="76" height="44" rx="10" fill="#5b53f5"/>
  <text x="618" y="1067" font-size="22" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700" fill="#f9f8f6" text-anchor="middle" dominant-baseline="central">78</text>
  <rect x="164" y="1103" width="10" height="10" fill="#5b53f5"/>
  <text x="184" y="1112" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">Critical — 4 findings</text>
  <rect x="164" y="1131" width="10" height="10" fill="#5b53f5" fill-opacity="0.6"/>
  <text x="184" y="1140" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">Major — 9 findings</text>
  <rect x="164" y="1159" width="10" height="10" fill="#5b53f5" fill-opacity="0.35"/>
  <text x="184" y="1168" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">Minor — 6 findings</text>

  <!-- Output: agent-ready.md (for a coding agent) -->
  <rect x="740" y="996" width="560" height="200" rx="16" fill="#f9f8f6" stroke="#d9d7d0" stroke-width="1"/>
  <line x1="740" y1="1028" x2="1300" y2="1028" stroke="#d9d7d0" stroke-width="1.5"/>
  <circle cx="764" cy="1012" r="4" fill="#d9d7d0"/>
  <circle cx="782" cy="1012" r="4" fill="#d9d7d0"/>
  <circle cx="800" cy="1012" r="4" fill="#d9d7d0"/>
  <text x="822" y="1017" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#78766f" dominant-baseline="central">report.md</text>
  <text x="764" y="1058" font-size="20" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="600" fill="#0a0a0b">agent-ready.md</text>
  <text x="764" y="1082" font-size="14" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" fill="#78766f">For an agent — tasks with acceptance criteria</text>
  <text x="764" y="1112" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#0a0a0b">## Hero CTA contrast</text>
  <text x="764" y="1134" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#0a0a0b">- [ ] Acceptance: contrast ≥ 4.5:1</text>
  <text x="764" y="1156" font-size="13" font-family="ui-monospace,'SF Mono',Menlo,monospace" fill="#0a0a0b">- [ ] Screenshot: img-06.webp</text>
</svg>
