<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Plain fallback for browsers that ignore the media-queried links below -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>Dmitrii Kovalev — Product Designer</title>
    <meta
      name="description"
      content="Senior product designer with 9 years of experience building design systems, fintech CRMs and SaaS products."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.fraimye.com/" />
    <meta property="og:title" content="Dmitrii Kovalev — Product Designer" />
    <meta
      property="og:description"
      content="Design systems, fintech CRMs and SaaS products. 9 years of practice."
    />

    <!--
      Display typeface: Mona Sans from Google Fonts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- No-flash theme bootstrap: runs before first paint -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <!-- Umami analytics (self-hosted) -->
    <script defer src="https://analytics.screela.com/script.js" data-website-id="5b2bc6a6-b035-49a3-a7f8-1201f8b37436"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
