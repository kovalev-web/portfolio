<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Plain fallback for browsers that ignore the media-queried links below -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Domain first, capability second: leading with "design systems" read as
         if that were the whole job. Keep this in step with `profile.headline`
         in src/data/content.ts. -->
    <title>Dmitrii Kovalev — B2B SaaS Product Designer</title>
    <meta
      name="description"
      content="9 years designing B2B SaaS — fintech CRMs, admin panels, internal tools, AI products. I turn messy workflows into interfaces people actually want to use."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.fraimye.com/" />
    <meta property="og:title" content="Dmitrii Kovalev — B2B SaaS Product Designer" />
    <meta
      property="og:description"
      content="9 years designing B2B SaaS — fintech CRMs, admin panels, internal tools, AI products. I turn messy workflows into interfaces people actually want to use."
    />
    <!-- Absolute URL: relative paths are not resolved by several crawlers.
         Width/height let clients reserve the card before the image loads. -->
    <meta property="og:image" content="https://www.fraimye.com/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Dmitrii Kovalev, Sr. Product Designer — B2B, CRM, SaaS. Interface work from fintech and SaaS products."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Display typeface: Mona Sans from Google Fonts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- No-flash theme bootstrap: runs before first paint -->
    <script>
      (function () {
        var t = localStorage.getItem('theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <!-- Umami analytics (self-hosted). `recorder.js` — not `script.js` — is
         the tracker that also feeds Replays & Heatmaps; the site itself still
         needs those toggled on in the Umami dashboard (Website → Settings →
         Replays & Heatmaps), which lives outside this repo. -->
    <script defer src="https://analytics.screela.com/recorder.js" data-website-id="5b2bc6a6-b035-49a3-a7f8-1201f8b37436"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
